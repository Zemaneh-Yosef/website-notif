# /etc/nginx/sites-available/notifs.royzmanim.com  (then: ln -s ../sites-available/notifs.royzmanim.com /etc/nginx/sites-enabled/)
# Certbot adds the TLS lines: sudo certbot --nginx -d notifs.royzmanim.com

# put these two lines in the http { } block of /etc/nginx/nginx.conf if you'd rather keep zones there
limit_req_zone $binary_remote_addr zone=notif_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=notif_read:10m rate=120r/m;

server {
	listen 80;
	listen [::]:80;
	server_name notifs.royzmanim.com;

	# Behind Cloudflare: the visitor's address from CF-Connecting-IP, trusted only from Cloudflare's ranges
	# (written by deploy/cloudflare-realip.sh). Without it every visitor would share Cloudflare's addresses
	# and so share one rate limit.
	include /etc/nginx/cloudflare-realip.conf;

	client_max_body_size 16k;
	client_body_timeout 10s;
	server_tokens off;

	location = /v1/health    { limit_req zone=notif_read burst=20 nodelay; proxy_pass http://127.0.0.1:8790; include /etc/nginx/royzmanim-notif-proxy.conf; }
	location = /v1/key       { limit_req zone=notif_read burst=20 nodelay; proxy_pass http://127.0.0.1:8790; include /etc/nginx/royzmanim-notif-proxy.conf; }
	location ~ ^/v1/(subscribe|subscription)$ {
		limit_req zone=notif_write burst=10 nodelay;
		proxy_pass http://127.0.0.1:8790;
		include /etc/nginx/royzmanim-notif-proxy.conf;
	}
	location / { return 404; }
}
